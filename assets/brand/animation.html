<!doctype html>
<html lang="uz">
	<head>
		<meta charset="utf-8" />
		<title>Video Downloader — GSAP animatsiya</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=block"
			rel="stylesheet"
		/>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #07070f;
				overflow: hidden;
			}
			#wrap {
				position: absolute;
				left: 0;
				top: 0;
				width: 1080px;
				height: 1080px;
				transform-origin: 0 0;
				font-family: 'Montserrat', 'Segoe UI', 'Ubuntu Sans', Arial, sans-serif;
				overflow: hidden;
			}
			svg {
				position: absolute;
				inset: 0;
			}
			#title {
				position: absolute;
				left: 0;
				right: 0;
				top: 815px;
				text-align: center;
				color: #fff;
				font-size: 74px;
				font-weight: 900;
				letter-spacing: 3px;
				white-space: pre;
			}
			#title span {
				display: inline-block;
			}
			#title .grad {
				background: linear-gradient(90deg, #fa7e1e, #d62976 45%, #962fbf 75%, #4f5bd5);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			#chips {
				position: absolute;
				left: 0;
				right: 0;
				top: 935px;
				display: flex;
				justify-content: center;
				gap: 22px;
			}
			.chip {
				padding: 14px 30px;
				border-radius: 999px;
				font-size: 34px;
				font-weight: 800;
				color: #fff;
				background: rgba(255, 255, 255, 0.08);
				border: 2px solid rgba(255, 255, 255, 0.18);
			}
			.chip.hot {
				background: linear-gradient(90deg, #ffd54a, #ff8a00);
				color: #1a0b2e;
				border-color: transparent;
			}
			body.avatar #title,
			body.avatar #chips {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="wrap">
			<svg viewBox="0 0 1080 1080" width="1080" height="1080">
				<defs>
					<linearGradient id="ig" x1="0" y1="1" x2="1" y2="0" gradientTransform="rotate(0 0.5 0.5)">
						<stop offset="0" stop-color="#feda75" />
						<stop offset="0.25" stop-color="#fa7e1e" />
						<stop offset="0.5" stop-color="#d62976" />
						<stop offset="0.75" stop-color="#962fbf" />
						<stop offset="1" stop-color="#4f5bd5" />
					</linearGradient>
					<radialGradient id="bgGrad" cx="0.5" cy="0.42" r="0.8">
						<stop offset="0" stop-color="#22134a" />
						<stop offset="1" stop-color="#07070f" />
					</radialGradient>
					<linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
						<stop offset="0" stop-color="#ffe066" />
						<stop offset="1" stop-color="#ff8a00" />
					</linearGradient>
					<filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
						<feGaussianBlur stdDeviation="70" />
					</filter>
					<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
						<feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#d62976" flood-opacity="0.5" />
					</filter>
					<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
						<feGaussianBlur stdDeviation="8" result="b" />
						<feMerge>
							<feMergeNode in="b" />
							<feMergeNode in="SourceGraphic" />
						</feMerge>
					</filter>
				</defs>

				<!-- Fon -->
				<rect width="1080" height="1080" fill="url(#bgGrad)" />
				<g id="glows" filter="url(#blur)" opacity="0.55">
					<circle cx="300" cy="320" r="190" fill="#d62976" />
					<circle cx="800" cy="360" r="210" fill="#4f5bd5" />
					<circle cx="560" cy="790" r="190" fill="#fa7e1e" />
				</g>

				<g id="logo">
					<!-- Progress halqasi -->
					<circle id="ringTrack" cx="540" cy="460" r="300" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="12" />
					<circle
						id="ring"
						cx="540"
						cy="460"
						r="300"
						fill="none"
						stroke="url(#ig)"
						stroke-width="14"
						stroke-linecap="round"
						transform="rotate(-90 540 460)"
						filter="url(#glow)"
					/>

					<!-- Instagram uslubidagi karta -->
					<g id="card">
						<rect x="310" y="230" width="460" height="460" rx="130" fill="url(#ig)" filter="url(#shadow)" />
						<rect x="362" y="282" width="356" height="356" rx="96" fill="none" stroke="#fff" stroke-width="26" />
						<circle id="dot" cx="650" cy="350" r="18" fill="#fff" />

						<path id="play" d="M508 400 L508 520 L612 460 Z" fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round" />

						<g id="arrow" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
							<path d="M540 360 V515" />
							<path d="M482 458 L540 516 L598 458" />
						</g>
						<path id="tray" d="M448 572 H632" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" />
					</g>

					<!-- Uchqunlar -->
					<g id="sparks" fill="#ffe066">
						<circle cx="775" cy="230" r="10" />
						<circle cx="775" cy="230" r="7" />
						<circle cx="775" cy="230" r="12" />
						<circle cx="775" cy="230" r="8" />
						<circle cx="775" cy="230" r="10" />
						<circle cx="775" cy="230" r="6" />
						<circle cx="775" cy="230" r="9" />
						<circle cx="775" cy="230" r="7" />
					</g>

					<!-- 4K belgisi -->
					<g id="badge">
						<rect x="688" y="178" width="174" height="104" rx="32" fill="url(#badgeGrad)" />
						<text
							x="775"
							y="250"
							text-anchor="middle"
							font-family="Montserrat, Segoe UI, Arial, sans-serif"
							font-size="66"
							font-weight="900"
							fill="#1a0b2e"
						>4K</text>
					</g>
				</g>
			</svg>

			<div id="title"></div>
			<div id="chips">
				<div class="chip">1080p</div>
				<div class="chip">2K</div>
				<div class="chip hot">4K</div>
				<div class="chip">MP3</div>
			</div>
		</div>

		<script src="gsap.min.js"></script>
		<script>
			const params = new URLSearchParams(location.search)
			const RENDER = params.has('render') // kadrma-kadr eksport rejimi
			const AVATAR = params.has('avatar') // profil rasmi rejimi
			if (AVATAR) document.body.classList.add('avatar')

			// Ekranga moslash (oddiy ko'rish rejimida)
			const wrap = document.getElementById('wrap')
			function fit() {
				if (RENDER) return
				const s = Math.min(innerWidth, innerHeight) / 1080
				wrap.style.transform = `translate(${(innerWidth - 1080 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`
			}
			addEventListener('resize', fit)
			fit()

			// Sarlavhani harflarga bo'lish
			const title = document.getElementById('title')
			const words = [
				['VIDEO', ''],
				[' ', ''],
				['DOWNLOADER', 'grad'],
			]
			for (const [w, cls] of words)
				for (const ch of w) {
					const s = document.createElement('span')
					s.textContent = ch
					if (cls) s.className = cls
					title.appendChild(s)
				}

			const DURATION = 6
			const RING_LEN = 2 * Math.PI * 300
			const tl = gsap.timeline({ paused: RENDER || AVATAR, repeat: RENDER || AVATAR ? 0 : -1 })

			// Boshlang'ich holat
			gsap.set('#card', { svgOrigin: '540 460', scale: 0, rotation: -25 })
			gsap.set('#dot', { transformOrigin: '50% 50%', scale: 0 })
			gsap.set('#play', { transformOrigin: '50% 50%', scale: 0 })
			gsap.set('#arrow', { y: -260, opacity: 0 })
			gsap.set('#tray', { strokeDasharray: 184, strokeDashoffset: 184 })
			gsap.set('#ring', { strokeDasharray: RING_LEN, strokeDashoffset: RING_LEN })
			gsap.set('#ringTrack', { opacity: 0 })
			gsap.set('#badge', { transformOrigin: '50% 50%', scale: 0, rotation: -30 })
			gsap.set('#sparks circle', { opacity: 0 })
			gsap.set('#title span', { y: 70, opacity: 0, rotationX: -90 })
			gsap.set('.chip', { y: 40, opacity: 0, scale: 0.8 })
			gsap.set('#logo', { opacity: 1 })

			// Fon: doimiy aylanish va gradient harakati (loop uchun aniq 360°)
			tl.to('#glows', { rotation: 360, svgOrigin: '540 540', duration: DURATION, ease: 'none' }, 0)
			tl.fromTo(
				'#ig',
				{ attr: { gradientTransform: 'rotate(0 0.5 0.5)' } },
				{ attr: { gradientTransform: 'rotate(360 0.5 0.5)' }, duration: DURATION, ease: 'none' },
				0,
			)

			// 1. Karta paydo bo'ladi
			tl.to('#card', { scale: 1, rotation: 0, duration: 0.9, ease: 'back.out(1.7)' }, 0.05)
			tl.to('#ringTrack', { opacity: 1, duration: 0.6 }, 0.3)
			tl.to('#dot', { scale: 1, duration: 0.4, ease: 'back.out(3)' }, 0.55)

			// 2. Play tugmasi
			tl.to('#play', { scale: 1, duration: 0.5, ease: 'back.out(2.2)' }, 0.7)
			tl.to('#play', { scale: 0, rotation: 120, duration: 0.35, ease: 'back.in(2)' }, 1.45)

			// 3. Yuklab olish strelkasi tushadi
			tl.to('#arrow', { y: 0, opacity: 1, duration: 0.7, ease: 'bounce.out' }, 1.65)
			tl.to('#tray', { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' }, 1.9)

			// 4. Yuklanish halqasi to'ladi, strelka "pulsatsiya" qiladi
			tl.to('#ring', { strokeDashoffset: 0, duration: 1.4, ease: 'power2.inOut' }, 2.0)
			tl.to('#arrow', { y: 20, duration: 0.22, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 2.35)

			// 5. Tayyor! Karta silkinadi, 4K belgisi va uchqunlar
			tl.to('#card', { scale: 1.06, duration: 0.14, ease: 'power1.out', yoyo: true, repeat: 1 }, 3.4)
			tl.to('#badge', { scale: 1, rotation: 0, duration: 0.8, ease: 'elastic.out(1, 0.45)' }, 3.45)
			const sparks = gsap.utils.toArray('#sparks circle')
			sparks.forEach((c, i) => {
				const a = (i / sparks.length) * Math.PI * 2
				const d = 120 + (i % 3) * 30
				tl.fromTo(
					c,
					{ x: 0, y: 0, opacity: 1, scale: 1 },
					{ x: Math.cos(a) * d, y: Math.sin(a) * d, opacity: 0, scale: 0.3, duration: 0.8, ease: 'power3.out' },
					3.5,
				)
			})

			// 6. Sarlavha va chiplar
			tl.to('#title span', { y: 0, opacity: 1, rotationX: 0, duration: 0.55, stagger: 0.035, ease: 'back.out(2)' }, 3.6)
			tl.to('.chip', { y: 0, opacity: 1, scale: 1, duration: 0.5, stagger: 0.1, ease: 'back.out(2.5)' }, 4.1)
			tl.to('.chip.hot', { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 4.75)

			// 7. Loop uchun yumshoq yo'qolish
			tl.to(['#logo', '#title', '#chips'], { opacity: 0, duration: 0.45, ease: 'power2.in' }, DURATION - 0.5)
			tl.set(['#logo', '#title', '#chips'], { opacity: 1 }, DURATION)

			if (AVATAR) {
				// Profil rasmi: to'liq kadr, logotip markazda va kattaroq
				tl.seek(4.9)
				gsap.set('#logo', { svgOrigin: '540 460', x: 0, y: 80, scale: 1.15 })
				gsap.set('#glows', { y: -20 })
			}

			window.__anim = { tl, duration: DURATION, ready: document.fonts.ready }
		</script>
	</body>
</html>
